# Weekly dependency update proposals. Python is declared as the `uv`
# ecosystem, not `pip`, because the project pins through uv.lock and CI runs
# `uv lock --check`: a pip-ecosystem update would edit pyproject.toml, leave the
# lockfile behind and fail that check on every PR it opened.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Dependabot already waits 3 days by default before proposing a version
    # update. Widen that to a week: a compromised release is usually pulled
    # within days of publication, and 3 sits at the edge of that window.
    # Security updates bypass cooldown either way (zizmor: dependabot-cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Dependabot already waits 3 days by default before proposing a version
    # update. Widen that to a week: a compromised release is usually pulled
    # within days of publication, and 3 sits at the edge of that window.
    # Security updates bypass cooldown either way (zizmor: dependabot-cooldown).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
