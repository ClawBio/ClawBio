name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-summary:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Commit summary
        run: |
          echo "## Commit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`$(git rev-parse --short HEAD)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Author** | $(git log -1 --format='%an') |" >> $GITHUB_STEP_SUMMARY
          echo "| **Message** | $(git log -1 --format='%s') |" >> $GITHUB_STEP_SUMMARY
          echo "| **Time** | $(git log -1 --format='%ci') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Files changed" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          git diff --stat HEAD~1 HEAD >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  lockfile-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Check lockfile is up to date
        run: uv lock --check

  dependency-audit:
    # Report-only, deliberately. Two reasons, both verified against uv 0.10.12:
    #
    #   1. `uv audit` exits 0 even when it reports findings, so gating would
    #      mean parsing its output ourselves. Not worth it while there is a
    #      backlog of nine affected packages to clear first -- a gate born red
    #      is how the scientific-audit job below ended up carrying `|| true`
    #      for months (#342).
    #   2. The subcommand is still experimental and warns that it may change
    #      without notice, so its exit codes and output are not a stable
    #      contract to build a gate on yet.
    #
    # Promote to a gate once the backlog is cleared and the subcommand settles.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Audit locked dependencies
        id: audit
        # Deliberately unflagged. setup-uv installs whichever uv is latest
        # (no version input, no required-version), and this preview subcommand
        # has already renamed things across versions: `--all-groups` does not
        # exist on 0.12.9, and `--preview-features audit` became
        # `audit-command`. Auditing every group is the default, so the bare
        # command is the one form that works on both. The experimental warning
        # is cosmetic and lands in the report.
        #
        # `|| true` keeps findings from failing the build (this job is
        # report-only), but it would also hide the tool itself breaking. So
        # assert the report is a report: `uv audit` always prints a "Found N
        # known vulnerabilities" line, and if that is missing the subcommand
        # changed, was removed, or died -- which must fail loudly rather than
        # render an empty summary nobody reads.
        run: |
          uv audit > audit.txt 2>&1 || true
          if ! grep -qE '^Found [0-9]+ known vulnerabilit' audit.txt; then
            echo "::error::uv audit produced no recognisable report - the audit step is broken, not clean"
            cat audit.txt
            exit 1
          fi

      - name: Post summary
        if: always()
        run: |
          echo "## Dependency Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Report-only: this job never fails the build." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat audit.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit
          path: audit.txt
          retention-days: 30

  skill-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Install dependencies from lockfile
        run: uv sync --frozen --only-group dev

      - name: Validate SKILL.md files (agentskills spec)
        run: |
          echo "## Skill Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          failed=0
          passed=0
          touch /tmp/skill_validate.log
          for skill_dir in skills/*/; do
            [ -f "$skill_dir/SKILL.md" ] || continue
            if uv run agentskills validate "$skill_dir" >> /tmp/skill_validate.log 2>&1; then
              passed=$((passed + 1))
            else
              failed=$((failed + 1))
            fi
          done
          echo "**${passed} passed** | **${failed} failed**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/skill_validate.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/skill_validate.log
          if [ "$failed" -gt 0 ]; then
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          # Needed to diff against the PR base and find which skills changed.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # --all-extras: skill-level deps live in [project.optional-dependencies]
          # (just-prs declares typer and fastmcp). A plain sync omits them, so
          # skills/just-prs-mcp/tests failed to import typer and took the whole
          # job down with it on any PR that reached those tests.
          uv sync --locked --all-extras
          uv pip install pytest requests

      - name: Test ClawBio CLI
        run: uv run python clawbio.py list

      - name: Run PharmGx Reporter tests
        run: uv run pytest skills/pharmgx-reporter/tests/test_pharmgx.py -v

      - name: Run Equity Scorer tests
        run: uv run pytest skills/equity-scorer/tests/test_equity_scorer.py -v

      - name: Run NutriGx tests
        run: uv run pytest skills/nutrigx/tests/test_nutrigx.py -v

      - name: Run Genome Comparator tests
        run: uv run pytest skills/genome-compare/tests/test_genome_compare.py -v

      - name: Run ClinPGx tests
        run: uv run pytest skills/clinpgx/tests/test_clinpgx.py -v

      - name: Run GWAS PRS tests
        run: uv run pytest skills/gwas-prs/tests/ -v

      - name: Run GWAS Lookup tests
        run: uv run pytest skills/gwas-lookup/tests/test_gwas_lookup.py -v

      - name: Run RNA-seq DE tests
        run: uv run pytest skills/rnaseq-de/tests/test_rnaseq_de.py -v

      - name: Run nf-core Sarek Wrapper tests
        run: uv run pytest skills/nfcore-sarek-wrapper/tests/ -v

      - name: Run Skill Builder tests
        run: uv run pytest skills/skill-builder/tests/test_skill_builder.py -v

      - name: Run VCF Annotator tests
        run: uv run pytest skills/vcf-annotator/tests/test_vcf_annotator.py -v

      - name: Run bot security tests
        run: uv run pytest bot/tests/test_security.py -v

      # Repo-level tests were never run by this job. The steps above name skill
      # test files individually, so `tests/` was invisible to CI: both
      # test_generate_catalog.py and the bench-baseline gate's own tests could
      # have gone red on main without anything reporting it. A gate whose tests
      # do not run is the #342 problem one level up. (See also #337.)
      - name: Run repo-level tests
        run: uv run pytest tests/ -v

      # The steps above are a hardcoded allowlist, so a NEW skill's tests never
      # run: ClawBio#329 shipped a test that cannot pass and CI was still green,
      # and ClawBio#324's just-prs suite never executed here at all. Any skill
      # touched by a PR now has its own tests run, which is the minimum bar for
      # a contribution to be considered verified.
      - name: Run tests for skills changed in this PR
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # Diff the PR head against its FORK POINT, not against the base tip.
          # actions/checkout resolves a pull_request to refs/pull/N/merge, so
          # HEAD is a merge commit containing main's later commits too, and
          # pull_request.base.sha is the base tip as of when the PR was opened.
          # Using either directly attributes everything merged into main since
          # to the PR: on #327 that turned one touched skill into five, and an
          # unrelated skill's broken import was reported as the PR's failure.
          head="${{ github.event.pull_request.head.sha }}"
          base=$(git merge-base "${{ github.event.pull_request.base.sha }}" "$head")
          echo "Diffing $base..$head"
          changed=$(git diff --name-only "$base" "$head" -- 'skills/*' \
                    | cut -d/ -f2 | sort -u)
          if [ -z "$changed" ]; then
            echo "No skills touched by this PR."
            exit 0
          fi
          status=0
          for skill in $changed; do
            # skills/ holds files as well as skill dirs (catalog.json), and a
            # deleted skill still shows up in the diff.
            if [ ! -d "skills/$skill" ]; then
              continue
            fi
            if [ ! -d "skills/$skill/tests" ]; then
              echo "WARNING: skills/$skill has no tests/ directory"
              continue
            fi
            # Pick the runner from what tests/ actually contains. pytest exits
            # 5 when it collects nothing, so running it unconditionally fails
            # every skill whose tests are not Python. On #329 (an R skill with
            # a run_test.sh harness) pytest collected 0 items, the job went
            # red, and the harness that would really have tested it never ran
            # — a maintainer-side red tick on a contributor's PR, which is the
            # same class of misattribution the merge-base fix above addresses.
            pycount=$(find "skills/$skill/tests" \
                        \( -name 'test_*.py' -o -name '*_test.py' \) | wc -l)
            if [ "$pycount" -gt 0 ]; then
              echo "::group::pytest skills/$skill/tests"
              uv run pytest "skills/$skill/tests" -v || status=1
              echo "::endgroup::"
              continue
            fi
            harness=$(find "skills/$skill/tests" -maxdepth 1 -name '*.sh' \
                        | sort | head -1)
            if [ -n "$harness" ]; then
              # Handed to the skill-harness job below, which provisions the
              # skill's own environment.yml and actually runs it. Skipped here
              # rather than reported NOT VERIFIED, so the two jobs do not
              # contradict each other in the same run.
              msg="DEFERRED: skills/$skill ships $harness; the skill-harness job runs it."
            else
              msg="NOT VERIFIED: skills/$skill has a tests/ directory with neither Python tests nor a shell harness."
            fi
            echo "::warning::$msg"
            echo "- $msg" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status

  # Issue #360. A skill whose tests are a shell harness was never actually
  # verified by anything: the `test` job correctly declined to run pytest
  # against it, but nothing else picked it up, so #329 went five remediation
  # rounds with its 17 assertions never executing here. Reporting NOT VERIFIED
  # was honest, but honest-and-unverified is still unverified.
  #
  # This job provisions the skill's OWN environment.yml rather than hardcoding
  # a toolchain, so it works for any future non-Python skill without further
  # edits. It is gated on a PR actually touching such a skill, because a
  # Bioconductor solve is minutes of runner time and most PRs need none of it.
  skill-harness:
    name: skill-harness
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Find skills whose harness this PR should run
        id: detect
        run: |
          set -euo pipefail
          head="${{ github.event.pull_request.head.sha }}"
          base=$(git merge-base "${{ github.event.pull_request.base.sha }}" "$head")
          changed=$(git diff --name-only "$base" "$head" -- 'skills/*' \
                    | cut -d/ -f2 | sort -u)
          runnable=""
          for skill in $changed; do
            [ -d "skills/$skill" ] || continue
            # Guard the directory before find touches it. Under `set -o
            # pipefail` a find on a missing path makes the whole substitution
            # non-zero, and `set -e` then kills the step: any skill without a
            # tests/ directory would have failed this job on most PRs.
            [ -d "skills/$skill/tests" ] || continue
            harness=$(find "skills/$skill/tests" -maxdepth 1 -name '*.sh' \
                        | sort | head -1)
            [ -n "$harness" ] || continue
            # No environment.yml is not an error: a harness can legitimately be
            # pure bash needing nothing. It runs bare, and fails on its own
            # terms if it does need something. Accusing a contributor of a
            # missing file their skill may not need is the expensive mistake.
            runnable="$runnable $skill"
          done
          echo "skills=$(echo $runnable | xargs)" >> "$GITHUB_OUTPUT"
          if [ -z "$(echo $runnable | xargs)" ]; then
            echo "No skill in this PR ships a shell harness." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install micromamba
        if: steps.detect.outputs.skills != ''
        run: |
          set -euo pipefail
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest \
            | tar -xvj -C /usr/local bin/micromamba
          micromamba --version

      - name: Run each harness in its own declared environment
        if: steps.detect.outputs.skills != ''
        run: |
          set -euo pipefail
          export MAMBA_ROOT_PREFIX=/tmp/mamba
          status=0
          for skill in ${{ steps.detect.outputs.skills }}; do
            env_file="skills/$skill/environment.yml"
            harness=$(find "skills/$skill/tests" -maxdepth 1 -name '*.sh' | sort | head -1)
            if [ ! -f "$env_file" ]; then
              echo "::group::$skill: bash $harness (no environment.yml; running bare)"
              bash "$harness" || status=1
              echo "::endgroup::"
              continue
            fi
            echo "::group::$skill: create env from $env_file"
            # Name the env after the skill rather than trusting the file's own
            # `name:`, so two skills cannot collide in one runner.
            if ! micromamba create -y -n "env-$skill" -f "$env_file"; then
              # A declared environment that will not solve means nobody can run
              # this skill as documented, so it is a real failure rather than a
              # skip.
              #
              # This comment previously cited claw-amplicon-qc (#329) as an
              # example whose environment.yml "has never been buildable". That
              # was WRONG and is corrected here. The solve that produced it ran
              # `--platform linux-64` from macOS, where the `__glibc` virtual
              # package is unset ("glibc version not found (virtual package
              # skipped)"), which makes every glibc-linked build unsatisfiable
              # and yields a conflict trace that reads exactly like a genuine
              # pin conflict. With CONDA_OVERRIDE_GLIBC set, that same file
              # solves. It was the third false finding this project has raised
              # against that one contributor.
              #
              # This job runs on ubuntu-latest, where `__glibc` is set
              # natively, so the artefact cannot occur here. Anyone reproducing
              # a failure from this job on macOS must set CONDA_OVERRIDE_GLIBC
              # before concluding the environment is broken.
              echo "::error::skills/$skill: environment.yml did not solve on this Linux runner, so its documented environment cannot be built. If reproducing on macOS, set CONDA_OVERRIDE_GLIBC first: a cross-platform solve without it fails for an unrelated reason."
              status=1
              echo "::endgroup::"
              continue
            fi
            echo "::endgroup::"
            echo "::group::$skill: bash $harness"
            micromamba run -n "env-$skill" bash "$harness" || status=1
            echo "::endgroup::"
          done
          exit $status

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv sync --locked
          uv pip install pytest pyyaml

      - name: Run reference genome benchmarks
        run: uv run pytest tests/benchmark/test_reference_genome.py -v

  scientific-audit:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install ClawBio dependencies
        run: uv sync --locked

      - name: Install clawbio-bench
        run: uv pip install "clawbio-bench @ git+https://github.com/biostochastics/clawbio_bench.git@49a0f11a8393b87a90f0721261a9bec5d52b61db"

      # The bench's own exit code is intentionally not the gate: it returns
      # non-zero whenever `overall.pass` is false, which is true today for
      # seven harnesses of pre-existing debt (#106). Gating on it would block
      # every unrelated PR, and the `|| true` that this job carried for months
      # (#342) would go straight back on. So the bench is allowed to report,
      # and the *baseline comparison* below is the gate.
      - name: Run scientific correctness audit (smoke)
        env:
          # The pinned clawbio_bench revision requests the curated T2D panel as
          # --pgs-id PGS000013. Since ClawBio issue #356 that alias is opt-in;
          # only benchmark runs opt in. Drop this once clawbio_bench requests
          # --panel-id CLAWBIO-T2D-8 directly.
          CLAWBIO_ALLOW_LEGACY_PGS_ALIAS: "1"
        run: |
          mkdir -p results
          uv run clawbio-bench --smoke --repo . || true

      - name: Render markdown summary
        if: always()
        run: |
          if ls results/suite/*/verdicts/*.json 1>/dev/null 2>&1; then
            SUITE_DIR=$(ls -d results/suite/*/ | head -1)
            uv run clawbio-bench --render-markdown "$SUITE_DIR" --markdown-output results/summary.md || true
          fi

      - name: Upload bench verdicts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scientific-audit-verdicts
          path: results/
          retention-days: 30

      - name: Post summary
        if: always()
        run: |
          echo "## Scientific Correctness Audit" >> $GITHUB_STEP_SUMMARY
          if [ -f results/summary.md ]; then
            cat results/summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "Bench ran but no markdown summary was generated. Check artifacts." >> $GITHUB_STEP_SUMMARY
          fi

      # THE GATE (#342). Everything above this point is `|| true` or
      # `if: always()`, so without this step the job cannot fail and its green
      # tick carries no information. Deliberately NOT `if: always()`: it must
      # run, and a missing report exits 2 rather than passing quietly.
      - name: Fail on regression against the committed baseline
        run: |
          REPORT=$(ls -t results/suite/*/aggregate_report.json 2>/dev/null | head -1)
          if [ -z "$REPORT" ]; then
            echo "::error::The bench produced no aggregate_report.json. Treating as failure, not as a pass."
            exit 2
          fi
          uv run python scripts/check_bench_baseline.py "$REPORT" \
            --baseline bench_baseline.json \
            --summary "$GITHUB_STEP_SUMMARY"
