name: Deploy site

# Publishes the repository root to GitHub Pages (clawbio.ai), byte-for-byte what
# legacy "Deploy from a branch" (main, /) serves today. Needs the repo's Pages
# source set to "GitHub Actions" (Settings -> Pages); until then the deploy job fails.
# A later step will build index.html's live numbers here instead of in daily PRs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
          # legacy Pages serves dotfiles too (.claude-plugin/, .zenodo.json); .git and .github stay out
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
