name: Deploy site

# Publishes the repository root to GitHub Pages (clawbio.ai), byte-for-byte what
# legacy "Deploy from a branch" (main, /) serves today. Needs the repo's Pages
# source set to "GitHub Actions" (Settings -> Pages); until then the deploy job fails.
# Before upload, scripts/build_site.py fills index.html's live numbers (data-stat spans),
# so they no longer need daily PRs. The daily schedule keeps stars and forks current.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # merged-PR authors count as contributors
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Only pyyaml: build_catalog() needs nothing else, and the project's core deps are heavy.
      - name: Fill live numbers
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --python 3.12 --with pyyaml python scripts/build_site.py

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .
          # legacy Pages serves dotfiles too (.claude-plugin/, .zenodo.json); .git and .github stay out
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
