[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clawbio"
description = "Bioinformatics-native AI agent skill library. Local-first, reproducible, built on OpenClaw."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dynamic = ["version"]
authors = [
    { name = "Manuel Corpas", email = "mc.admin@manuelcorpas.com" },
]
keywords = [
    "bioinformatics",
    "genomics",
    "ai-agents",
    "openclaw",
    "gwas",
    "pharmacogenomics",
    "polygenic-risk-score",
    "reproducibility",
    "population-genetics",
    "variant-annotation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "biopython>=1.88",
    "conda-lock>=4.0.2",
    "google-auth>=2.58.0,<3",
    "google-cloud-bigquery>=3.45.1,<4",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openai>=3.13.0",
    "opentelemetry-sdk>=1.44.0,<2",
    "pandas>=3.0.5",
    "pyyaml>=6.0",
    "pydeseq2>=0.4",
    "rocrate>=0.15.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.10",
]

[project.optional-dependencies]
# DEPRECATED since 0.7.0, removed in 0.8.0 (see CHANGELOG). Kept so existing
# `uvx --from 'clawbio[mcp]' clawbio mcp` configurations keep working until then.
# Pinned below 2.0: mcp 2.0.0 removed mcp.server.fastmcp (now mcp.server.mcpserver).
mcp = ["mcp>=1.9,<2"]
just-prs = [
    "fastmcp>=3.4.4,<4",
    "typer>=0.27.2,<1",
]
# SuShiE fine-mapping engine (jax-based) for skills/fine-mapping.
# sushie pulls glimix-core itself; see the liknorm override under [tool.uv]
# for why that subtree is kept out of the installed environment.
fine-mapping = [
    "sushie>=0.20,<0.21",
]
# Shared by the four region skills (eqtl-catalogue-region-fetch,
# gwas-catalog-region-fetch, ld-1000g-region-compute, ukb-ppp-region-fetch).
# Declared here so `uv sync --all-extras` in CI can run their test suites;
# each SKILL.md already documents pysam>=0.22 for local installs (#406).
region-fetch = ["pysam>=0.22"]
# Light imaging dependencies for skills/cell-detection, so `uv sync --all-extras`
# can run its tests: 76 of its 80 tests need only these. cellpose itself is
# deliberately absent, because torch's default Linux wheels pull the CUDA
# runtime into every matrix job; the four tests that need it skip instead.
cell-detection = [
    "tifffile>=2024.8.30",
    "scikit-image>=0.24",
]
# Imported lazily by these skills but previously undeclared, so `uv.lock` never
# pinned them and `uv sync --all-extras` in CI never installed them.
labstep = ["labstep>=3.0"]
galaxy-bridge = ["bioblend>=1.2"]
affinity-proteomics = ["statsmodels>=0.14", "seaborn>=0.12"]

# PDF rendering in prs-abstain; the skill degrades to markdown-only without them.
prs-abstain = [
    "reportlab>=4.0,<5",
    "pillow>=10,<13",
]

[tool.uv]
# glimix-core (a hard dependency of sushie) requires liknorm, and liknorm 2.0.0
# pins cffi<2.0. cryptography>=48 requires cffi>=2.0, so leaving liknorm in the
# graph drags cryptography from 48.0.0 down to 45.0.7 for EVERY user of this
# lock, extras or not — and 45.0.7 carries known advisories (PYSEC-2026-2141,
# PYSEC-2026-35/36, GHSA-537c-gmf6-5ccf) that 48.0.0 does not.
#
# sushie's summary-statistics path (`sushie.infer_ss.infer_sushie_ss`, the only
# entry point skills/fine-mapping uses) imports glimix_core but never liknorm;
# glimix-core only loads it for the GLMM/exponential-family models that the
# individual-level path needs. So drop liknorm from the resolution rather than
# downgrading cryptography project-wide.
override-dependencies = ["liknorm ; sys_platform == 'clawbio-never'"]
# Note for anyone exporting this lock: `uv export` keeps the override's
# unsatisfiable marker, but plain pip re-resolves glimix-core's own metadata and
# puts liknorm back, which then conflicts with the locked cffi 2.0.0. That is
# why ci.yml's pip-audit job audits the synced venv rather than an exported
# requirements file.

[project.scripts]
clawbio = "clawbio.cli:main"

[project.urls]
Homepage = "https://clawbio.ai"
Documentation = "https://clawbio.github.io/ClawBio/"
Repository = "https://github.com/ClawBio/ClawBio"
Issues = "https://github.com/ClawBio/ClawBio/issues"

[dependency-groups]
dev = [
    "skills-ref>=0.1.1,<1",
    # prs-abstain tests inspect the rendered PDFs.
    "pypdf>=4,<7",
]
bot = [
    "python-telegram-bot[job-queue]>=22.8",
    "discord.py>=2.3.0",
    "flask>=3.0.0",
    "requests>=2.34.2",
    "python-dotenv>=1.2.3",
]

[tool.hatch.version]
path = "clawbio/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["clawbio"]
# The package's own test suite is not needed at runtime.
exclude = ["clawbio/tests", "clawbio/tests/**"]

# Bundle a curated subset of skills/ and examples/ into the wheel under the
# clawbio/ namespace (see hatch_build.py). Files stay at the repository root on
# disk so the Claude Code plugin marketplace and public skills/ URLs are intact.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# Ship the full source the wheel build needs (the build hook reads skills/ and
# examples/ from the unpacked sdist when conda or pip builds the wheel).
include = [
    "clawbio",
    "skills",
    "examples",
    "clawbio.py",
    "hatch_build.py",
    "pyproject.toml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "CITATION.cff",
]
