[pytest]
pythonpath = .
addopts = --import-mode=importlib
testpaths =
    bot/tests
    clawbio/common/tests
    clawbio/tests
    robotary/tests
    skills/*/tests
    tests/benchmark
    tests
python_files = test_*.py
python_functions = test_*
markers =
    integration: marks tests that require external tools or network access (deselect with '-m "not integration"')
    mcp: marks tests that launch a real MCP server
    network: marks tests that require live network access
    slow: marks tests that may take minutes or download substantial data
