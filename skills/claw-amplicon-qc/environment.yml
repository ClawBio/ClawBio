name: amplicon-qc
channels:
  - conda-forge
  - bioconda
dependencies:
  # R runtime — conda-forge builds
  - r-base>=4.4

  # Bioconductor packages the script imports.
  # Version pins are load-bearing here: bioconda ships both r41_* builds
  # (against r-base 4.1.3) and r44_* builds (against r-base 4.4.x) for
  # these packages. Without a version pin, the solver may pick an r41_*
  # build and silently downgrade r-base to 4.1.3 to satisfy it, breaking
  # the >=4.4 constraint. The version pins below correspond to the
  # Bioconductor 3.20 release cycle, which only exists as r44_* builds
  # and therefore forces the solver into the R 4.4 lineage.
  - bioconductor-dada2>=1.34
  - bioconductor-shortread>=1.64
  - bioconductor-biostrings>=2.74

  # CRAN packages the script imports
  - r-optparse
  - r-jsonlite       # DEFECT 3: was missing from env despite `library(jsonlite)`
                     # in the script. r-yaml (previously listed here but never
                     # used) has been removed.

  # External tools invoked via system2()
  - cutadapt
  - seqkit
