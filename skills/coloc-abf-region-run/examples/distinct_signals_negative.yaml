# Demo: two traits that are both strongly associated in the same window, at
# causal variants 60 kb apart. This is the case colocalisation exists to rule
# out, and the one a regional p-value plot alone will not tell you about.
#
# Both tables are SYNTHETIC (see make_demo_data.py).
#
# Expected: PP.H3 dominates, so the honest read is "both associated here, not the
# same variant", not a colocalisation.
#
#   python skills/coloc-abf-region-run/coloc_abf_region_run.py \
#       --demo distinct_signals_negative --output /tmp/coloc_distinct

trait1:
  sumstats: sumstats/synthetic_eqtl_distinct.tsv
  trait_type: quant
  sdY: 1.0
  label: gene expression (synthetic eQTL)

trait2:
  sumstats: sumstats/synthetic_gwas_distinct.tsv
  trait_type: quant
  sdY: 1.0
  label: a lipid trait (synthetic GWAS)
