name: clawbio-scrna
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.11
  - scanpy=1.10.2
  - anndata=0.10.8
  - numpy=1.26.4
  - pandas=2.2.2
  - matplotlib=3.8.4
  - leidenalg=0.10.2
  - python-igraph=0.11.6
  - pip
  - pip:
      # Optional — only needed for the two `optional: true` steps.
      # detect_doublets: scrublet. annotate_celltypist: celltypist (also
      # needs a locally installed model; runtime downloads are disabled,
      # see scripts/annotate_celltypist.py).
      - scrublet==0.2.3
      - celltypist==1.7.1
